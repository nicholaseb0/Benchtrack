services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: benchtrack }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bench"], interval: 3s, retries: 10 }
  api:
    build: ./server
    environment: { DATABASE_URL: "postgres://bench:bench@db:5432/benchtrack" }
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
